name: Quality gate
on:
  push:
    branches: [main, "experimental/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Syntax validation
        run: npm run check
      - name: Regression tests
        run: npm test
      - name: V2.2 narrative module syntax
        run: |
          node --check v2/app.js
          node --check v2/engine.js
          node --check v2/episode2-ui.js
          node --check v2/episode3-content.js
          node --check v2/episode3-engine.js
          node --check v2/episode3-ui.js
      - name: V2.2 complete Act I regression tests
        run: node --test v2/tests/*.test.mjs
